<div class="ps-progress" aria-hidden="true"></div>
<article class="ps">
  <header class="ps-head">
    <ol class="crumbs reveal"><li><a href="journal.html">Journal</a></li><li><a href="journal.html#stories">{{post_catname}}</a></li></ol>
    <h1 class="ps-title reveal" data-d="1">{{post_title}}</h1>
    <p class="ps-meta reveal" data-d="2"><time datetime="{{post_iso}}">{{post_date}}</time><span>{{post_read}}</span></p>
  </header>
  <figure class="ps-cover clip"><img src="{{post_hero}}" alt="{{post_alt}}" fetchpriority="high" data-speed="-.05"></figure>
  <div class="ps-body">
{{post_body}}
  </div>
  <footer class="ps-foot">
    <a class="link-back" href="journal.html#stories"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> All stories</a>
    <a class="btn btn-ghost btn-wa" href="https://wa.me/?text={{post_share}}" target="_blank" rel="noopener">{{> wa-icon}} Share this story</a>
  </footer>
</article>

<section class="sec paper-2">
  <div class="wrap">
    <div class="split-head"><h2 class="h2 split"><span class="ln">Keep <em>reading.</em></span></h2><a class="btn btn-ghost reveal" href="journal.html#stories">Every story {{> arrow}}</a></div>
    <div class="ps-rel">
{{post_related}}
    </div>
  </div>
</section>
{{post_cta}}
